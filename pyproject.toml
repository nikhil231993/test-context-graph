[project]
name = "test-context-graph"
version = "0.1.0"
description = "A context graph of a Java Spring codebase (code, API specs, tests, docs) that helps coding agents write tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "pyyaml>=6.0",
    "lancedb>=0.13",
    "fastembed>=0.4",
    "mcp>=1.2.0,<2",
]

[project.scripts]
tcg = "test_context_graph.cli:main"
tcg-mcp = "test_context_graph.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_context_graph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
