openapi: 3.0.1
info:
  title: Bookshop
  version: "1.0"
servers:
  - url: http://localhost:8080/bookshop/api
paths:
  /books:
    get:
      tags: [books]
      operationId: listBooks
      summary: Lists all books
      responses:
        "200":
          description: The books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
  /books/{bookId}:
    get:
      tags: [books]
      operationId: getBook
      summary: Gets a book by id
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: No such book
components:
  schemas:
    Book:
      type: object
      required: [title]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
